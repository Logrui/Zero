services:
  frontend:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      VITE_PUBLIC_BACKEND_URL: ${VITE_PUBLIC_BACKEND_URL:-http://backend:8787}
      VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-http://localhost:3500}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3500:3000"
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zero-network

  backend:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    environment:
      # Database and Core Services
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zerodotemail}
      REDIS_URL: ${REDIS_URL:-http://upstash-proxy:80}
      REDIS_TOKEN: ${REDIS_TOKEN:-upstash-local-token}
      
      # Email Services
      RESEND_API_KEY: ${RESEND_API_KEY}
      
      # AI Services
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-2.5-flash}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      USE_OPENAI: ${USE_OPENAI:-false}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_MINI_MODEL: ${OPENAI_MINI_MODEL}
      
      # Authentication
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://backend:8787}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      
      # Communication Services
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      
      # Cloudflare Workers Configuration
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      WRANGLER_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      
      # Cloudflare Service Bindings
      CF_VECTORIZE_INDEX_THREADS: ${CF_VECTORIZE_INDEX_THREADS:-threads-vector-production}
      CF_VECTORIZE_INDEX_MESSAGES: ${CF_VECTORIZE_INDEX_MESSAGES:-messages-vector-production}
      CF_R2_BUCKET_THREADS: ${CF_R2_BUCKET_THREADS:-threads-production}
      CF_QUEUE_THREAD: ${CF_QUEUE_THREAD:-thread-queue-production}
      CF_QUEUE_SUBSCRIBE: ${CF_QUEUE_SUBSCRIBE:-subscribe-queue-production}
      CF_QUEUE_SEND_EMAIL: ${CF_QUEUE_SEND_EMAIL:-send-email-queue-production}
      
      # Environment
      NODE_ENV: production
      WRANGLER_LOG: ${WRANGLER_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      upstash-proxy:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./apps/server/wrangler.prod.jsonc:/app/apps/server/wrangler.prod.jsonc:ro
      - wrangler-cache:/app/.wrangler
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8787']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zero-network

  migrations:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zerodotemail}
    depends_on:
      db:
        condition: service_healthy
    command: ['pnpm', 'run', 'db:migrate']
    restart: 'no'
    networks:
      - zero-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zerodotemail}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'zerodotemail']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zero-network
  
  valkey:
    image: docker.io/bitnami/valkey:8.0
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    volumes:
      - valkey-data:/bitnami/valkey/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-h', 'localhost', '-p', '6379', 'ping']
      interval: 10s
      timeout: 5s
  upstash-proxy:
    image: hiett/serverless-redis-http:latest
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '8079:80'
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_TOKEN:-upstash-local-token}
      SRH_CONNECTION_STRING: 'redis://valkey:6379'
      NODE_ENV: production
    networks:
      - zero-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  zero-network:
    driver: bridge

volumes:
  postgres-data:
  valkey-data:
  wrangler-cache:
