version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: apps/mail/Dockerfile.production
    ports:
      - "3500:3500"
    environment:
      - VITE_PUBLIC_BACKEND_URL=https://api.yourdomain.com
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zerodotemail
    ports:
      - "5432:5432"  # Only accessible via tunnel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  upstash-proxy:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_TOKEN}
      SRH_CONNECTION_STRING: 'redis://redis:6379'
    ports:
      - "8079:80"
    depends_on:
      - redis
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    volumes:
      - ./cloudflared:/etc/cloudflared
    restart: unless-stopped
    depends_on:
      - frontend
      - postgres
      - upstash-proxy

volumes:
  postgres-data:
  redis-data: