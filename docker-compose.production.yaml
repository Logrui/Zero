version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: apps/mail/Dockerfile.production
    ports:
      - "3500:3500"
    environment:
      - VITE_PUBLIC_BACKEND_URL=https://api.yourdomain.com
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zerodotemail
      POSTGRES_HOST_AUTH_METHOD: md5
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/ssl/server.crt
      -c ssl_key_file=/var/lib/postgresql/ssl/server.key
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-ssl:/var/lib/postgresql/ssl:ro
    restart: unless-stopped

  valkey:
    container_name: zerodotemail-redis
    image: docker.io/bitnamilegacy/valkey:8.0
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/bitnami/valkey/data

  upstash-proxy:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_TOKEN}
      SRH_CONNECTION_STRING: 'redis://redis:6379'
    ports:
      - "127.0.0.1:8079:80"  # Bind to localhost only for security
    depends_on:
      - valkey
    restart: unless-stopped

  # NOTE: Cloudflared runs as Windows Service, not in Docker
  # Configure as Windows Service with config at:
  # C:\Users\<YOUR-USERNAME>\.cloudflared\config.yml
  # Install: cloudflared service install
  # Start: net start cloudflared

volumes:
  postgres-data:
  redis-data:
  valkey-data: